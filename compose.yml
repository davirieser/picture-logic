services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: picturelogic
      POSTGRES_PASSWORD: picturelogic
      POSTGRES_DB: picturelogic
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U picturelogic -d picturelogic']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://picturelogic:picturelogic@db:5432/picturelogic
    ports:
      - '3000:3000'

volumes:
  pgdata:
